    <meta charset="UTF-8" />

    <meta name="theme-color" content="#000000" />
    <meta name="description" content="מדידת משקפיים במציאות רבודה: המצלמה נפתחת, והמשקפיים יושבים לכם על הפנים." />
    <title>משקפיים AR</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

  <body>
    <main id="stage" aria-label="תצוגת מצלמה עם משקפיים">
      <video id="cam" playsinline muted autoplay></video>
      <canvas id="gl"></canvas>
    </main>

    <div id="splash" role="status" aria-live="polite">
      <span class="ring" aria-hidden="true"></span>
      <p id="splash-text">פותחים מצלמה…</p>
      <button id="retry" type="button" hidden>לאפשר מצלמה</button>
    </div>

    <button id="dots" type="button" aria-pressed="true" hidden>נקודות: פועל</button>

    <p id="hint" role="status" aria-live="polite" hidden>הביטו למצלמה</p>
